[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "felt"
version = "0.1.0"
description = "Felt — a beautiful blackjack table that teaches correct basic strategy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Felt" }]
keywords = ["blackjack", "textual", "tui", "basic-strategy", "game"]
dependencies = ["textual>=0.80"]

[project.scripts]
felt = "felt.app:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/felt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
